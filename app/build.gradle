apply plugin: 'com.android.application'

android {
    namespace 'com.mkulesh.micromath.plus'

    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId "com.mkulesh.micromath.plus"
        minSdkVersion 14
        targetSdkVersion 36
        versionCode 325
        versionName "2.23.3"
        base.archivesName = "microMathematics-v" + versionName
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'RtlHardcoded', 'RtlSymmetry', 'RtlEnabled', 'NonConstantResourceId', 'CustomViewStyleable'
    }
}

dependencies {
    implementation 'com.android.support:multidex:1.0.3'

    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-numbers-parent:1.0'
}